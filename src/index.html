<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Responsive 2048 browser game built with HTML, CSS, vanilla JavaScript, and Vite."
    />
    <meta
      name="theme-color"
      content="#f4efe6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#333333"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:title" content="2048 Game" />
    <meta
      property="og:description"
      content="Play a responsive vanilla JavaScript version of the classic 2048 puzzle."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="./fonts/rubik-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      ;(() => {
        let stored = null

        try {
          // The same key as STORAGE_KEYS.THEME in src/scripts/constants.js. This is the one
          // read of storage that skips SafeStorage: it has to run before any module.
          stored = localStorage.getItem('theme')
        } catch {
          // Storage is blocked: the system setting decides.
        }

        const theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'

        document.documentElement.dataset.theme = theme
      })()
    </script>
    <script type="module" src="./scripts/main.js"></script>
    <title>2048</title>
  </head>
  <body>
    <div class="game-layout">
      <header class="game-header">
        <h1 class="logo">2048</h1>
        <div class="toolbar">
          <button
            class="toolbar-button new-game-button"
            aria-label="New game"
            title="New game"
          >
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button
            class="toolbar-button theme-toggle"
            aria-label="Switch to light theme"
            title="Switch to light theme"
          >
            <svg
              class="theme-icon-sun"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
            <svg
              class="theme-icon-moon"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z" />
            </svg>
          </button>
          <button
            class="toolbar-button settings-button"
            aria-label="Settings"
            title="Settings"
          >
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M10.1 5L10.5 2.5L13.5 2.5L13.9 5L15.6 5.8L17.6 4.2L19.8 6.4L18.2 8.4L19 10.1L21.5 10.5L21.5 13.5L19 13.9L18.2 15.6L19.8 17.6L17.6 19.8L15.6 18.2L13.9 19L13.5 21.5L10.5 21.5L10.1 19L8.4 18.2L6.4 19.8L4.2 17.6L5.8 15.6L5 13.9L2.5 13.5L2.5 10.5L5 10.1L5.8 8.4L4.2 6.4L6.4 4.2L8.4 5.8z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <div class="score-container">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span class="current-score" aria-hidden="true">0</span>
            <span
              class="score-announcement visually-hidden"
              aria-live="polite"
              aria-atomic="true"
            ></span>
            <span class="score-pops" aria-hidden="true"></span>
          </div>
          <div class="score-box">
            <span class="score-label">High Score</span>
            <span class="high-score">0</span>
            <button
              class="reset-high-score-button"
              aria-label="Reset high score"
              title="Reset high score"
              hidden
            >
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M20 12a8 8 0 1 1-2.34-5.66L20 8.7" />
                <path d="M20 4v4.7h-4.7" />
              </svg>
            </button>
            <span class="record-badge" aria-hidden="true" hidden>New record!</span>
          </div>
        </div>
      </header>
      <main class="game-container">
        <div class="game-grid" aria-label="2048 board"></div>
      </main>
    </div>

    <dialog class="win-overlay" aria-labelledby="win-title">
      <h2 id="win-title">You Won!</h2>
      <p class="win-message"></p>
      <div class="dialog-actions">
        <button class="continue-button" autofocus>Continue Playing</button>
        <button class="win-restart-button">New Game</button>
      </div>
    </dialog>

    <dialog class="game-over" aria-labelledby="game-over-title">
      <h2 id="game-over-title">Game Over!</h2>
      <p class="game-over-win-note" hidden></p>
      <p>No more moves available</p>
      <button class="restart-game-button" autofocus>Restart Game</button>
    </dialog>

    <dialog
      class="confirm-dialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
    >
      <h2 id="confirm-title" class="confirm-title"></h2>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="dialog-actions">
        <button class="confirm-cancel-button" autofocus></button>
        <button class="confirm-accept-button"></button>
      </div>
    </dialog>

    <dialog class="settings-dialog" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <section class="settings-section">
        <h3 id="settings-board-size-title">Board size</h3>
        <div
          class="segmented"
          role="radiogroup"
          aria-labelledby="settings-board-size-title"
        >
          <label class="segment">
            <input class="visually-hidden" type="radio" name="boardSize" value="3" />
            <span>3×3</span>
          </label>
          <label class="segment">
            <input class="visually-hidden" type="radio" name="boardSize" value="4" />
            <span>4×4</span>
          </label>
          <label class="segment">
            <input class="visually-hidden" type="radio" name="boardSize" value="5" />
            <span>5×5</span>
          </label>
        </div>
      </section>
      <section class="settings-section">
        <h3 id="settings-win-tile-title">Win target</h3>
        <div
          class="segmented"
          role="radiogroup"
          aria-labelledby="settings-win-tile-title"
        >
          <!-- The choices depend on the board size: SettingsView.render writes each
               radio's value and its label from WIN_TILES when the dialog opens. -->
          <label class="segment">
            <input class="visually-hidden" type="radio" name="winTile" value="" />
            <span></span>
          </label>
          <label class="segment">
            <input class="visually-hidden" type="radio" name="winTile" value="" />
            <span></span>
          </label>
          <label class="segment">
            <input class="visually-hidden" type="radio" name="winTile" value="" />
            <span></span>
          </label>
        </div>
      </section>
      <button class="settings-close-button" autofocus>Close</button>
    </dialog>
  </body>
</html>
