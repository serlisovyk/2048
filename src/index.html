<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Responsive 2048 browser game built with HTML, CSS, vanilla JavaScript, and Vite."
    />
    <meta name="theme-color" content="#333333" />
    <meta property="og:title" content="2048 Game" />
    <meta
      property="og:description"
      content="Play a responsive vanilla JavaScript version of the classic 2048 puzzle."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="./fonts/rubik-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script type="module" src="./scripts/main.js"></script>
    <title>2048</title>
  </head>
  <body>
    <div class="game-layout">
      <header class="game-header">
        <h1 class="logo">2048</h1>
        <div class="toolbar">
          <button
            class="toolbar-button new-game-button"
            aria-label="New game"
            title="New game"
          >
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
        <div class="score-container">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span class="current-score" aria-hidden="true">0</span>
            <span
              class="score-announcement visually-hidden"
              aria-live="polite"
              aria-atomic="true"
            ></span>
            <span class="score-pops" aria-hidden="true"></span>
          </div>
          <div class="score-box">
            <span class="score-label">High Score</span>
            <span class="high-score">0</span>
            <button
              class="reset-high-score-button"
              aria-label="Reset high score"
              title="Reset high score"
              hidden
            >
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M20 12a8 8 0 1 1-2.34-5.66L20 8.7" />
                <path d="M20 4v4.7h-4.7" />
              </svg>
            </button>
          </div>
        </div>
      </header>
      <main class="game-container">
        <div class="game-grid" aria-label="2048 board"></div>
      </main>
    </div>

    <dialog class="win-overlay" aria-labelledby="win-title">
      <h2 id="win-title">You Won!</h2>
      <p>You've reached 2048!</p>
      <div class="dialog-actions">
        <button class="continue-button" autofocus>Continue Playing</button>
        <button class="win-restart-button">New Game</button>
      </div>
    </dialog>

    <dialog class="game-over" aria-labelledby="game-over-title">
      <h2 id="game-over-title">Game Over!</h2>
      <p class="game-over-win-note" hidden>You've reached 2048!</p>
      <p>No more moves available</p>
      <button class="restart-game-button" autofocus>Restart Game</button>
    </dialog>

    <dialog
      class="confirm-dialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
    >
      <h2 id="confirm-title" class="confirm-title"></h2>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="dialog-actions">
        <button class="confirm-cancel-button" autofocus></button>
        <button class="confirm-accept-button"></button>
      </div>
    </dialog>
  </body>
</html>
