<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Responsive 2048 browser game built with HTML, CSS, vanilla JavaScript, and Vite."
    />
    <meta name="theme-color" content="#333333" />
    <meta property="og:title" content="2048 Game" />
    <meta
      property="og:description"
      content="Play a responsive vanilla JavaScript version of the classic 2048 puzzle."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script type="module" src="./script.js"></script>
    <title>2048</title>
  </head>
  <body>
    <h1>2048 Game</h1>
    <header class="score-container">
      <div>Score: <span class="current-score">0</span></div>
      <div>High Score: <span class="high-score">0</span></div>
    </header>
    <main class="game-container">
      <div class="game-grid" aria-label="2048 board"></div>
    </main>

    <div
      class="win-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="win-title"
    >
      <h2 id="win-title">You Won!</h2>
      <p>You've reached 2048!</p>
      <button class="continue-button">Continue Playing</button>
    </div>

    <div
      class="game-over"
      role="dialog"
      aria-modal="true"
      aria-labelledby="game-over-title"
    >
      <h2 id="game-over-title">Game Over!</h2>
      <p>No more moves available</p>
      <button class="restart-game-button">Restart Game</button>
    </div>

    <button class="new-game-button">New Game</button>
  </body>
</html>
